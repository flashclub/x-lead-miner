<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>X Lead Miner</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #0f1419;
        --muted: #536471;
        --line: #cfd9de;
        --accent: #1d9bf0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #15202b;
          --fg: #e7e9ea;
          --muted: #8b98a5;
          --line: #38444d;
        }
      }
      body {
        width: 288px;
        margin: 0;
        padding: 14px;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 14px;
        font-weight: 700;
      }
      label {
        display: block;
        margin: 10px 0 4px;
        color: var(--muted);
        font-size: 12px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      input[type="url"] {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
      }
      button {
        margin-top: 10px;
        width: 100%;
        padding: 7px;
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .stats {
        display: flex;
        justify-content: space-between;
        margin-top: 14px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
      }
      .stats b {
        color: var(--fg);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .note {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.45;
      }
      .error {
        margin: 8px 0 0;
        color: #f4212e;
        font-size: 11px;
        word-break: break-word;
      }
      .hint {
        margin: 8px 0 0;
        color: var(--accent);
        font-size: 11px;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <h1>X Lead Miner</h1>

    <div class="row">
      <input type="checkbox" id="enabled" />
      <label for="enabled" style="margin: 0">在 x.com 上显示意向分数</label>
    </div>

    <label for="endpoint">打分端点</label>
    <input type="url" id="endpoint" spellcheck="false" />
    <button id="save">保存端点</button>
    <p class="hint" id="hint" hidden></p>

    <p class="note">
      推文直接从页面读取，不经过 X 搜索接口。分数来自 Workers AI 上的冻结句向量 + 本地训练的
      MLP head，每条帖子一次前向。
    </p>

    <div class="stats">
      <span>本次已打分</span>
      <b id="count">0</b>
    </div>
    <p class="error" id="error" hidden></p>

    <script src="popup.js"></script>
  </body>
</html>
