name: CI & Deploy (Cloudflare Workers)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Push-CI: verify the app builds. Needs no secrets (landing falls back
  # to sample leads when SCRAPER_API_KEY is absent — by design).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - name: Build (OpenNext → Cloudflare)
        env:
          NEXT_PUBLIC_STRIPE_PRO_PRICE_ID: price_demo_placeholder
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm build

  # Deploy is MANUAL (workflow_dispatch) and requires these repo secrets:
  #   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
  #   SCRAPER_API_KEY, AUTH_SECRET,
  #   GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET
  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    # secrets live in the repo's "dev" environment (added 2026-11-17)
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - name: Build + package (OpenNext → Cloudflare)
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          MULERUN_API_KEY: ${{ secrets.MULERUN_API_KEY }}
          NEXT_PUBLIC_STRIPE_PRO_PRICE_ID: price_demo_placeholder
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm exec opennextjs-cloudflare build --dangerouslyUseUnsupportedNextVersion
      - name: Install wrangler v4 (new asset upload API)
        run: npm install -g wrangler@4
      - name: Worker runtime secrets (SCRAPER / MULERUN / AUTH)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          MULERUN_API_KEY: ${{ secrets.MULERUN_API_KEY }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: |
          echo "$SCRAPER_API_KEY" | pnpm exec wrangler secret put SCRAPER_API_KEY
          echo "$MULERUN_API_KEY" | pnpm exec wrangler secret put MULERUN_API_KEY
          echo "$AUTH_SECRET" | pnpm exec wrangler secret put AUTH_SECRET
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
